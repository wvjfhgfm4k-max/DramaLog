<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DramaLog</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🎬 DramaLog</h1>

<p>Dein persönlicher Asia-Drama Tracker</p>

</header>


<div class="container">

<input
id="search"
type="text"
placeholder="🔍 Serie suchen..."
>

<button id="addButton">

➕ Neue Serie

</button>


<section class="dashboard">

<div class="box">

❤️

<h3>Favoriten</h3>

<span id="favCount">0</span>

</div>

<div class="box">

📺

<h3>Aktuell</h3>

<span id="watchingCount">0</span>

</div>

<div class="box">

✅

<h3>Gesehen</h3>

<span id="seenCount">0</span>

</div>

<div class="box">

📝

<h3>Wunschliste</h3>

<span id="wishCount">0</span>

</div>

</section>

<h2>Meine Serien</h2>

<div id="seriesList">

<p class="empty">

Noch keine Serien gespeichert.

</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
